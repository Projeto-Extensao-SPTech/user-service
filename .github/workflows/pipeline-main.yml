name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Testes
        run: ./mvnw test

      - name: Buildar projeto (gera o JAR)
        run: ./mvnw -DskipTests clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # develop: só build local (valida Dockerfile + jar), não publica
      - name: Build da imagem (sem push) - develop
        if: github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gustapa/user-service:dev-ci

      # main ou tag v*: faz login e publica
      - name: Login no Docker Hub (main ou release tag)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main: publica latest + sha
      - name: Build e Push - main
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gustapa/user-service:latest
            gustapa/user-service:${{ github.sha }}

      # tag v*: publica a versão do release (github.ref_name = o nome do tag, ex: v1.2.3) + sha
      - name: Build e Push - release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            gustapa/user-service:${{ github.ref_name }}
            gustapa/user-service:${{ github.sha }}
