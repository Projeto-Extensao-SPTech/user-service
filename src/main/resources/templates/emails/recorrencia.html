<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0; padding:20px; background:#052759; font-family:'Baloo 2', Arial, sans-serif;">

<h2 style="color:#FCAD0B; text-align:center; margin-bottom:30px; font-size:28px;">
    Notificações do Abrigo Dog Feliz
</h2>

<div th:each="mail : ${notifications}"
     style="background:#fff; border-radius:16px; padding:22px; margin:0 auto 22px auto;
              max-width:600px; box-shadow:0 4px 10px rgba(0,0,0,0.15); border:1px solid #e5e7eb;">

    <h3 th:text="${mail.subject}"
        style="color:#052759; font-size:20px; margin-top:0; margin-bottom:12px; font-weight:700;"></h3>

    <p th:text="${mail.content}"
       style="color:#333; font-size:16px; line-height:1.6; margin:0; font-weight:500;"></p>
</div>

<p style="color:#FCAD0B; text-align:center; font-size:18px; font-weight:700;">
    Acesse o site
    <a th:href="${siteUrl}" style="color:white;">abrigo-dog-feliz.com</a>
</p>

</body>
</html>
