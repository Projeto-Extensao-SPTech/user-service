<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Recuperação de senha — Abrigo Dog Feliz</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body style="margin:0;padding:0;background-color:#f0f2f5;font-family:'Baloo 2',Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f2f5;padding:32px 16px;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

                <tr>
                    <td style="background-color:#052759;padding:40px 32px 32px;text-align:center;">
                        <p style="margin:0 0 10px;color:#FCAD0B;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;">
                            Abrigo Dog Feliz
                        </p>
                        <h1 style="margin:0 0 8px;color:#ffffff;font-size:24px;font-weight:700;line-height:1.3;">
                            Código de verificação
                        </h1>
                        <p style="margin:0;color:rgba(255,255,255,0.65);font-size:14px;line-height:1.6;">
                            Use o código abaixo para redefinir sua senha. Ele expira em alguns minutos.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="background-color:#ffffff;padding:40px;text-align:center;">
                        <div style="display:inline-block;background:#f8fafc;border-radius:12px;padding:18px 28px;">
                            <p style="margin:0;color:#6b7280;font-size:12px;">Seu código</p>
                            <p th:text="${code}" style="margin:8px 0 0;font-size:36px;font-weight:700;color:#052759;letter-spacing:2px;">0000</p>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="background-color:#052759;padding:24px 28px;text-align:center;color:#FCAD0B;">
                        <p style="margin:0 0 6px;font-size:13px;font-weight:700;">🐾 Abrigo Dog Feliz</p>
                        <a th:href="${siteUrl}" style="color:rgba(255,255,255,0.65);font-size:12px;text-decoration:none;">abrigo-dog-feliz.com</a>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
