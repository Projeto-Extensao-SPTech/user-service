spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:userdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080
  error:
    include-stacktrace: never

jasypt:
  encryptor:
    password: example-encryptor-password
    fixed-salt: example-fixed-salt

security:
  jwt:
    secret-key: example-secret-key
    expiration-time: 3600000

mail:
  gmail:
    host: smtp.gmail.com
    port: 587
    username: example@gmail.com
    password: example
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  outlook:
    host: smtp.office365.com
    port: 587
    username: example@outlook.com
    password: example
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cors:
  allowed-origins:
    - http://localhost:7000
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS

evolution:
  api:
    url: http://localhost:8081/
    key: example-key
  instance:
    name: example-instance

uploads:
  path: uploads