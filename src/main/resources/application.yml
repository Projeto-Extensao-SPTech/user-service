spring:


  servlet:
    multipart:
      max-file-size: 10MB      # Tamanho máximo de um arquivo individual
      max-request-size: 15MB

  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    defer-datasource-initialization: true # Garante que o data.sql rode DEPOIS das tabelas
