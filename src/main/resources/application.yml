spring:
    application:
        name: user-service
    datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password:
    h2:
        console:
            enabled: true
            path: /h2-console

server:
    port: 7000

jasypt:
    encryptor:
        password:
        fixed-salt:

security:
    jwt:
        secret-key:
        expiration-time: 3600000

mail:
    gmail:
        host: smtp.gmail.com
        port: 587
        username:
        password:
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    outlook:
        host: smtp.office365.com
        port: 587
        username:
        password:
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
